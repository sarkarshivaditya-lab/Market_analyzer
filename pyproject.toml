[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "market-analyzer"
version = "0.1.0"
description = "AI financial intelligence and investment decision platform"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "matplotlib>=3.9",
  "yfinance>=0.2.54",
  "torch>=2.5",
  "stockstats>=0.6.5",
  "tqdm>=4.66",
  "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
